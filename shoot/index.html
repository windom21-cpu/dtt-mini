<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>的当てゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0b1020;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between;
    font-size: 18px; font-weight: 700;
    text-shadow: 0 2px 4px rgba(0,0,0,.6);
    pointer-events: none;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.55);
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: clamp(24px, 6vw, 48px); margin-bottom: 12px; }
  #overlay p { font-size: clamp(14px, 3vw, 18px); margin-bottom: 24px; opacity: .85; }
  #startBtn {
    font-size: 20px; padding: 14px 32px;
    background: #ff4d6d; color: #fff;
    border: none; border-radius: 999px;
    cursor: pointer; font-weight: 700;
    box-shadow: 0 6px 20px rgba(255,77,109,.5);
  }
  #startBtn:active { transform: scale(.96); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>残り: <span id="time">30</span>秒</div>
  </div>
  <div id="overlay">
    <h1 id="title">的当てゲーム</h1>
    <p id="desc">右から流れてくる的をクリック / タップで撃ち落とそう!<br>制限時間は30秒。</p>
    <button id="startBtn">スタート</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const descEl = document.getElementById('desc');
  const startBtn = document.getElementById('startBtn');

  let W = 0, H = 0, dpr = 1;
  const wrap = document.getElementById('wrap');
  function viewportSize() {
    const vv = window.visualViewport;
    return {
      w: vv ? vv.width : window.innerWidth,
      h: vv ? vv.height : window.innerHeight,
    };
  }
  function resize() {
    dpr = window.devicePixelRatio || 1;
    const v = viewportSize();
    W = v.w;
    H = v.h;
    document.documentElement.style.height = H + 'px';
    document.body.style.height = H + 'px';
    wrap.style.width = W + 'px';
    wrap.style.height = H + 'px';
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
    window.visualViewport.addEventListener('scroll', resize);
  }
  resize();

  const targets = [];
  const particles = [];
  let score = 0;
  let timeLeft = 30;
  let running = false;
  let lastSpawn = 0;
  let spawnInterval = 900;
  let lastTime = 0;
  let timerId = null;

  function spawnTarget() {
    const r = 20 + Math.random() * 28;
    const topPad = 56;
    const bottomPad = 72;
    const minY = r + topPad;
    const maxY = H - r - bottomPad;
    const y = maxY > minY ? minY + Math.random() * (maxY - minY) : H / 2;
    const speed = 80 + Math.random() * 140 + (30 - timeLeft) * 4;
    const hue = Math.floor(Math.random() * 360);
    targets.push({ x: W + r, y, r, vx: -speed, hue, alive: true });
  }

  function spawnParticles(x, y, hue) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 100 + Math.random() * 200;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.6,
        age: 0,
        hue,
      });
    }
  }

  function hit(x, y) {
    let hitOne = false;
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      if (!t.alive) continue;
      const dx = x - t.x, dy = y - t.y;
      const hitR = t.r + 18;
      if (dx * dx + dy * dy <= hitR * hitR) {
        t.alive = false;
        spawnParticles(t.x, t.y, t.hue);
        score += Math.max(1, Math.round(50 / t.r * 10));
        scoreEl.textContent = score;
        targets.splice(i, 1);
        hitOne = true;
        break;
      }
    }
    if (!hitOne) {
      score = Math.max(0, score - 1);
      scoreEl.textContent = score;
    }
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src = (e.touches && e.touches[0]) ? e.touches[0] : e;
    const sx = W / rect.width;
    const sy = H / rect.height;
    return {
      x: (src.clientX - rect.left) * sx,
      y: (src.clientY - rect.top) * sy,
    };
  }

  canvas.addEventListener('mousedown', (e) => {
    if (!running) return;
    const p = getPos(e);
    hit(p.x, p.y);
  });
  canvas.addEventListener('touchstart', (e) => {
    if (!running) return;
    e.preventDefault();
    const p = getPos(e);
    hit(p.x, p.y);
  }, { passive: false });

  function drawTarget(t) {
    const { x, y, r, hue } = t;
    ctx.save();
    ctx.translate(x, y);
    const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
    grad.addColorStop(0, `hsl(${hue}, 90%, 70%)`);
    grad.addColorStop(1, `hsl(${hue}, 80%, 40%)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function update(dt) {
    lastSpawn += dt * 1000;
    const interval = Math.max(280, spawnInterval - (30 - timeLeft) * 18);
    if (lastSpawn >= interval) {
      lastSpawn = 0;
      spawnTarget();
    }
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      t.x += t.vx * dt;
      if (t.x + t.r < 0) targets.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
    }
  }

  function render() {
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, W, H);
    // 背景の流線
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const y = ((Date.now() / 20 + i * 100) % H);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    for (const t of targets) drawTarget(t);
    for (const p of particles) {
      const alpha = 1 - p.age / p.life;
      ctx.fillStyle = `hsla(${p.hue}, 90%, 65%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4 * alpha + 1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop(ts) {
    if (!running) return;
    if (!lastTime) lastTime = ts;
    const dt = Math.min(0.05, (ts - lastTime) / 1000);
    lastTime = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function start() {
    score = 0;
    timeLeft = 30;
    targets.length = 0;
    particles.length = 0;
    lastSpawn = 0;
    lastTime = 0;
    scoreEl.textContent = score;
    timeEl.textContent = timeLeft;
    overlay.classList.add('hidden');
    running = true;
    requestAnimationFrame(loop);
    timerId = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) end();
    }, 1000);
  }

  function end() {
    running = false;
    clearInterval(timerId);
    titleEl.textContent = '終了!';
    descEl.innerHTML = `スコア: <b>${score}</b><br>もう一度遊べます。`;
    startBtn.textContent = 'もう一度';
    overlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
